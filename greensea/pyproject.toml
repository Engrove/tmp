[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greensea"
version = "0.1.0"
description = "GreenSea: autonomous long-session runner for a local llama.cpp server, with its own web interface"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
greensea = "greensea.__main__:main"

[tool.setuptools]
packages = ["greensea"]

[tool.setuptools.package-data]
greensea = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
